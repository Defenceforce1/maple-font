name: Personal Maple Mono Narrow 300-525 Line 0.95

on:
  workflow_dispatch:
  push:
    branches: [v7]
    paths:
      - .github/workflows/personal-300.yml
      - config.json
      - build.py
      - source/py/personal_profile.py

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        width: [narrow]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FONT_WIDTH: ${{ matrix.width }}
      BUILD_ARGS: --archive --cn --normal --no-liga --no-nf --no-hinted --width ${{ matrix.width }} --ttf-only --least-styles
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install font build dependencies
        run: |
          pip install -r requirements.txt
          pip install uharfbuzz
      - name: Check final configuration
        run: |
          python build.py $BUILD_ARGS --dry > final-config.json
          python - <<'PY'
          import json, os
          c = json.load(open("final-config.json"))
          assert c["weight_mapping"]["regular"] == 300
          assert c["weight_mapping"]["bold"] == 525
          assert c["infinite_arrow"] is False
          assert c["remove_tag_liga"] is True
          assert c["cn"]["with_nerd_font"] is False
          assert c["enable_ligature"] is False
          assert c["nerd_font"]["enable"] is False
          assert c["cn"]["enable"] is True
          assert c["use_hinted"] is False
          assert c["cn"]["use_hinted"] is False
          assert c["cn"]["scale_factor"] == [1.0, 1.0]
          assert c["width"] == os.environ["FONT_WIDTH"]
          assert c["line_height"] == 0.95
          print("Verified:", c["width"], "Regular/Italic 300, Bold/BoldItalic 525")
          PY
      - name: Build font
        run: python build.py $BUILD_ARGS
      - name: Verify generated Chinese fonts
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          files = list(Path("fonts/CN").glob("*.ttf"))
          assert len(files) == 4, [str(p) for p in files]
          expected = {"Regular": 300, "Italic": 300, "Bold": 525, "BoldItalic": 525}
          for p in files:
              style = p.stem.rsplit("-", 1)[-1]
              assert style in expected, str(p)
              with TTFont(p) as f:
                  assert f["OS/2"].usWeightClass == expected[style], (str(p), f["OS/2"].usWeightClass)
                  assert "fvar" not in f, str(p)
                  cmap = f.getBestCmap()
                  assert ord("中") in cmap, str(p)
                  aw = f["hmtx"].metrics[cmap[ord("A")]][0]
                  cw = f["hmtx"].metrics[cmap[ord("中")]][0]
                  assert cw == 2 * aw, (str(p), aw, cw)
                  bold, italic = style.startswith("Bold"), style.endswith("Italic")
                  assert bool(f["OS/2"].fsSelection & 32) == bold, str(p)
                  assert bool(f["OS/2"].fsSelection & 1) == italic, str(p)
                  assert bool(f["head"].macStyle & 1) == bold, str(p)
                  assert bool(f["head"].macStyle & 2) == italic, str(p)
                  from source.py.personal_profile import audit_font, excluded_codepoint
                  import uharfbuzz as hb
                  result = audit_font(f)
                  assert result["private_use"] == result["nonmark_ligatures"] == 0
                  assert result["kana"] > 0, result
                  assert not result["coding_features"], result
                  assert not any(excluded_codepoint(cp) for cp in cmap), str(p)
                  assert aw == 550 and cw == 1100, (str(p), aw, cw)
                  assert f["post"].isFixedPitch, str(p)
                  assert "Jpan" in str(f["meta"].data)
                  assert f["hhea"].ascent == 969 and f["hhea"].descent == -285, (str(p), f["hhea"].ascent, f["hhea"].descent)
                  hbfont = hb.Font(hb.Face(p.read_bytes()))
                  hbfont.scale = (f["head"].unitsPerEm, f["head"].unitsPerEm)
                  for text in ("-> <-- ==> == === != !== <= >= >>= ffi fi fl", "[TODO] [INFO] __ \\\\"):
                      buf = hb.Buffer()
                      buf.add_str(text)
                      buf.guess_segment_properties()
                      hb.shape(hbfont, buf, {tag: True for tag in ("liga", "calt", "dlig", "ss01", "ss02", "ss03", "ss04", "ss07", "ss08", "ss09", "ss10", "ss11")})
                      assert len(buf.glyph_infos) == len(text), (str(p), text)
                      assert [g.cluster for g in buf.glyph_infos] == list(range(len(text))), (str(p), text)
                      assert all(pos.x_advance == 550 for pos in buf.glyph_positions), (str(p), text)
                  print("FINAL", p.name, result, "shaping checks passed")
                  print(p.name, "weight", f["OS/2"].usWeightClass, "Latin width", aw, "Chinese width", cw)
          PY
      - name: Upload font archives
        uses: actions/upload-artifact@v4
        with:
          name: Maple-Mono-${{ matrix.width }}-300-525
          path: fonts/archive/*-CN-unhinted.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Narrow font package
        uses: actions/download-artifact@v4
        with:
          pattern: Maple-Mono-*-300-525
          path: packages
          merge-multiple: true
      - name: Create downloadable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s\n' 'Narrow; original character variants retained; CN and Japanese supported; no programming ligatures or private-use icons; unhinted; Regular/Italic 300; genuine Latin and Chinese Bold/BoldItalic 525; line_height 0.95; four linked TTF styles; Chinese/Latin width 1100/550.' > release-notes.txt
          gh release create "personal-300-525-${{ github.run_id }}" packages/*.* --title "Maple Mono CN — Narrow, 300 / 525, line 0.95" --notes-file release-notes.txt
