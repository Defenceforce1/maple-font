name: Personal Maple Mono Compact Latin 400 Chinese 300 Bold 525

on:
  workflow_dispatch:
  push:
    branches: [v7]
    paths:
      - .github/workflows/personal-300.yml
      - config.json
      - build.py
      - source/py/personal_profile.py
      - source/py/ink_width.py

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        width: [narrow]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FONT_WIDTH: ${{ matrix.width }}
      BUILD_ARGS: --archive --cn --normal --no-liga --no-nf --no-hinted --width ${{ matrix.width }} --ttf-only --least-styles
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install font build dependencies
        run: |
          pip install -r requirements.txt
          pip install uharfbuzz
      - name: Check final configuration
        run: |
          python build.py $BUILD_ARGS --dry > final-config.json
          python - <<'PY'
          import json, os
          c = json.load(open("final-config.json"))
          assert c["weight_mapping"]["regular"] == 400
          assert c["weight_mapping"]["bold"] == 525
          assert c["cn"]["weight_mapping"] == {"regular": 300, "bold": 525}
          assert c["cn"]["latin_ink_scale"] == 1.08
          assert c["cn"]["ink_scale"] == 1.03
          assert c["infinite_arrow"] is False
          assert c["remove_tag_liga"] is True
          assert c["cn"]["with_nerd_font"] is False
          assert c["enable_ligature"] is False
          assert c["nerd_font"]["enable"] is False
          assert c["cn"]["enable"] is True
          assert c["use_hinted"] is False
          assert c["cn"]["use_hinted"] is False
          assert c["cn"]["scale_factor"] == [1.0, 1.0]
          assert c["width"] == os.environ["FONT_WIDTH"]
          assert c["line_height"] == 0.90
          print("Verified:", c["width"], "Regular/Italic 400, Bold/BoldItalic 525")
          PY
      - name: Build font
        run: python build.py $BUILD_ARGS
      - name: Verify generated Chinese fonts
        run: |
          python - <<'PY'
          import os, json
          from pathlib import Path
          from fontTools.ttLib import TTFont
          files = list(Path("fonts/CN").glob("*.ttf"))
          assert len(files) == 4, [str(p) for p in files]
          expected = {"Regular": 400, "Italic": 400, "Bold": 525, "BoldItalic": 525}
          for p in files:
              style = p.stem.rsplit("-", 1)[-1]
              assert style in expected, str(p)
              with TTFont(p) as f:
                  assert int(f["meta"].data["owgt"]) == expected[style], (str(p), f["meta"].data["owgt"])
                  assert int(f["meta"].data["lwgt"]) == expected[style]
                  assert int(f["meta"].data["cwgt"]) == (525 if style.startswith("Bold") else 300)
                  assert f["OS/2"].usWeightClass == (700 if style.startswith("Bold") else 400), (str(p), f["OS/2"].usWeightClass)
                  assert "fvar" not in f, str(p)
                  cmap = f.getBestCmap()
                  assert ord("中") in cmap, str(p)
                  aw = f["hmtx"].metrics[cmap[ord("A")]][0]
                  cw = f["hmtx"].metrics[cmap[ord("中")]][0]
                  assert cw == 2 * aw, (str(p), aw, cw)
                  bold, italic = style.startswith("Bold"), style.endswith("Italic")
                  assert bool(f["OS/2"].fsSelection & 32) == bold, str(p)
                  assert bool(f["OS/2"].fsSelection & 1) == italic, str(p)
                  assert bool(f["head"].macStyle & 1) == bold, str(p)
                  assert bool(f["head"].macStyle & 2) == italic, str(p)
                  from source.py.personal_profile import audit_font, excluded_codepoint
                  import uharfbuzz as hb
                  result = audit_font(f)
                  assert result["private_use"] == result["nonmark_ligatures"] == 0
                  assert result["kana"] > 0, result
                  assert not result["coding_features"], result
                  assert not any(excluded_codepoint(cp) for cp in cmap), str(p)
                  expected_aw = {"narrow": 550, "default": 600}[os.environ["FONT_WIDTH"]]
                  assert aw == expected_aw and cw == 2 * expected_aw, (str(p), aw, cw)
                  assert f["post"].isFixedPitch, str(p)
                  assert float(f["meta"].data["hxsc"]) == 1.08
                  assert float(f["meta"].data["lxsc"]) == 1.08
                  assert float(f["meta"].data["cxsc"]) == 1.03
                  samples = json.loads(f["meta"].data["hbud"])
                  for cp, snapshot in samples.items():
                      g = f["glyf"][cmap[int(cp)]]
                      assert g.xMax - g.xMin == snapshot["after"]
                      assert f["hmtx"].metrics[cmap[int(cp)]][0] == snapshot["advance"]
                      assert snapshot["after"] >= snapshot["before"]
                  if not italic:
                      for cp in map(ord, "H0中"):
                          assert samples[str(cp)]["after"] > samples[str(cp)]["before"]
                  assert samples[str(ord("中"))]["factor"] == 1.03
                  assert samples[str(ord("H"))]["factor"] <= 1.08
                  print("INK WIDTH VERIFIED", samples)
                  assert "Jpan" in str(f["meta"].data)
                  assert f["hhea"].ascent == 918 and f["hhea"].descent == -270, (str(p), f["hhea"].ascent, f["hhea"].descent)
                  hbfont = hb.Font(hb.Face(p.read_bytes()))
                  hbfont.scale = (f["head"].unitsPerEm, f["head"].unitsPerEm)
                  for text in ("-> <-- ==> == === != !== <= >= >>= ffi fi fl", "[TODO] [INFO] __ \\\\"):
                      buf = hb.Buffer()
                      buf.add_str(text)
                      buf.guess_segment_properties()
                      hb.shape(hbfont, buf, {tag: True for tag in ("liga", "calt", "dlig", "ss01", "ss02", "ss03", "ss04", "ss07", "ss08", "ss09", "ss10", "ss11")})
                      assert len(buf.glyph_infos) == len(text), (str(p), text)
                      assert [g.cluster for g in buf.glyph_infos] == list(range(len(text))), (str(p), text)
                      assert all(pos.x_advance == aw for pos in buf.glyph_positions), (str(p), text)
                  for text in ("Á", "é", "ä"):
                      buf = hb.Buffer()
                      buf.add_str(text)
                      buf.guess_segment_properties()
                      hb.shape(hbfont, buf)
                      assert sum(pos.x_advance for pos in buf.glyph_positions) == aw, (str(p), text)
                  print("MIXED WEIGHTS", p.name, "Latin", int(f["meta"].data["lwgt"]), "Chinese/Japanese", int(f["meta"].data["cwgt"]))
                  print("FINAL", p.name, result, "shaping checks passed")
                  print(p.name, "outline weight", int(f["meta"].data["owgt"]), "system style weight", f["OS/2"].usWeightClass, "Latin width", aw, "Chinese width", cw)
          PY
      - name: Upload font archives
        uses: actions/upload-artifact@v4
        with:
          name: Maple-Mono-${{ matrix.width }}-400-525
          path: fonts/archive/*-CN-unhinted.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download both width packages
        uses: actions/download-artifact@v4
        with:
          pattern: Maple-Mono-*-400-525
          path: packages
          merge-multiple: true
      - name: Create downloadable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s\n' 'Compact ink profile; independent ink expansion: Latin up to 8 percent and Chinese/Japanese up to 3 percent inside unchanged Narrow cells; existing overhangs and box drawing preserved; original character variants retained; CN and Japanese supported; no programming ligatures or private-use icons; unhinted; Latin Regular/Italic 400 and Chinese/Japanese Regular/Italic 300; genuine Latin and Chinese Bold/BoldItalic 525; line_height 0.90; standard Regular/Bold system registration 400/700 with source outline weights Latin 400/525, Chinese/Japanese 300/525; four linked TTF styles; Chinese/Latin widths 1100/550.' > release-notes.txt
          gh release create "personal-compact-l400-c300-b525-x108-103-line090-${{ github.run_id }}" packages/*.* --title "Maple Mono Compact CN — Latin 400 +8%, Chinese 300 +3%, Bold 525, line 0.90, fixed style matching" --notes-file release-notes.txt
