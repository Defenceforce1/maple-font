name: Personal Maple Mono 300-600 Narrow and Slim

on:
  workflow_dispatch:
  push:
    branches: [v7]
    paths:
      - .github/workflows/personal-300.yml
      - config.json
      - build.py

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        width: [narrow, slim]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FONT_WIDTH: ${{ matrix.width }}
      BUILD_ARGS: --archive --cn --normal --no-liga --no-nf --no-hinted --width ${{ matrix.width }} --ttf-only --least-styles
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install font build dependencies
        run: pip install -r requirements.txt
      - name: Check final configuration
        run: |
          python build.py $BUILD_ARGS --dry > final-config.json
          python - <<'PY'
          import json, os
          c = json.load(open("final-config.json"))
          assert c["weight_mapping"]["regular"] == 300
          assert c["weight_mapping"]["bold"] == 600
          assert c["enable_ligature"] is False
          assert c["nerd_font"]["enable"] is False
          assert c["cn"]["enable"] is True
          assert c["use_hinted"] is False
          assert c["cn"]["use_hinted"] is False
          assert c["cn"]["scale_factor"] == [1.0, 1.0]
          assert c["width"] == os.environ["FONT_WIDTH"]
          print("Verified:", c["width"], "Regular/Italic 300, Bold/BoldItalic 600")
          PY
      - name: Build font
        run: python build.py $BUILD_ARGS
      - name: Verify generated Chinese fonts
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          files = list(Path("fonts/CN").glob("*.ttf"))
          assert len(files) == 4, [str(p) for p in files]
          expected = {"Regular": 300, "Italic": 300, "Bold": 600, "BoldItalic": 600}
          for p in files:
              style = p.stem.rsplit("-", 1)[-1]
              assert style in expected, str(p)
              with TTFont(p) as f:
                  assert f["OS/2"].usWeightClass == expected[style], (str(p), f["OS/2"].usWeightClass)
                  assert "fvar" not in f, str(p)
                  cmap = f.getBestCmap()
                  assert ord("中") in cmap, str(p)
                  aw = f["hmtx"].metrics[cmap[ord("A")]][0]
                  cw = f["hmtx"].metrics[cmap[ord("中")]][0]
                  assert cw == 2 * aw, (str(p), aw, cw)
                  bold, italic = style.startswith("Bold"), style.endswith("Italic")
                  assert bool(f["OS/2"].fsSelection & 32) == bold, str(p)
                  assert bool(f["OS/2"].fsSelection & 1) == italic, str(p)
                  assert bool(f["head"].macStyle & 1) == bold, str(p)
                  assert bool(f["head"].macStyle & 2) == italic, str(p)
                  print(p.name, "weight", f["OS/2"].usWeightClass, "Latin width", aw, "Chinese width", cw)
          PY
      - name: Upload font archives
        uses: actions/upload-artifact@v4
        with:
          name: Maple-Mono-${{ matrix.width }}-300-600
          path: fonts/archive/*-CN-unhinted.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download both font packages
        uses: actions/download-artifact@v4
        with:
          pattern: Maple-Mono-*-300-600
          path: packages
          merge-multiple: true
      - name: Create downloadable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s\n' 'Narrow and Slim; Normal NL CN; unhinted; no Nerd Font icons; Regular/Italic 300; Bold/BoldItalic 600; --ttf-only --least-styles. Both packages contain four linked styles and maintain Chinese/Latin 2:1 width.' > release-notes.txt
          gh release create "personal-300-600-${{ github.run_id }}" packages/*.* --title "Maple Mono CN — Narrow + Slim, 300 / 600" --notes-file release-notes.txt
